<svg xmlns="http://www.w3.org/2000/svg" width="2356" height="1182" viewBox="0 0 2356 1182" font-family="Avenir Next, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"><defs><marker id="ah-_23848592-100" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7.2" preserveAspectRatio="none" refX="6" refY="5" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10 2.5,5" fill="#848592"/></marker></defs><rect x="0" y="0" width="2356" height="1182" fill="#0e0e13"/><g transform="translate(48.0,426.0)"><path d="M 220 60 L 334 60" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 560 26 L 650 26 Q 658 26 658 18 L 658 -213 Q 658 -221 666 -221 L 674 -221" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 560 93 L 650 93 Q 658 93 658 101 L 658 202 Q 658 210 666 210 L 674 210" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 560 238 L 674 238" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 560 470 L 650 470 Q 658 470 658 462 L 658 275 Q 658 267 666 267 L 674 267" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 450 589 L 450 567 Q 450 559 458 559 L 782 559 Q 790 559 790 551 L 790 315" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 560 60 L 674 60" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 900 44 L 990 44 Q 998 44 998 36 L 998 -25 Q 998 -33 1006 -33 L 1014 -33" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 1240 -33 L 1330 -33 Q 1338 -33 1338 -41 L 1338 -198 Q 1338 -206 1346 -206 L 1354 -206" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 1580 -237 L 1670 -237 Q 1678 -237 1678 -245 L 1678 -301 Q 1678 -309 1686 -309 L 1694 -309" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 1920 -309 L 2034 -309" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 900 75 L 990 75 Q 998 75 998 83 L 998 145 Q 998 153 1006 153 L 1014 153" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 1580 -206 L 1670 -206 Q 1678 -206 1678 -198 L 1678 -140 Q 1678 -132 1686 -132 L 1694 -132" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 900 -221 L 1014 -221" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><path d="M 1240 -237 L 1354 -237" fill="none" stroke="#848592" stroke-width="1.5" marker-end="url(#ah-_23848592-100)"/><rect x="249" y="51" width="62" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="280" y="60" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">motivates</text><rect x="631" y="-106" width="54" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="658" y="-97" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">requires</text><rect x="631" y="143" width="54" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="658" y="152" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">requires</text><rect x="588" y="229" width="64" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="620" y="238" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">underpins</text><rect x="626" y="360" width="64" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="658" y="369" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">underpins</text><rect x="594" y="550" width="52" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="620" y="559" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">satisfies</text><rect x="588.5" y="51" width="63" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="620" y="60" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">starts with</text><rect x="931.5" y="35" width="35" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="949" y="44" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">then</text><rect x="1320.5" y="-128" width="35" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="1338" y="-119" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">then</text><rect x="1611.5" y="-246" width="35" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="1629" y="-237" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">then</text><rect x="1955.5" y="-318" width="49" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="1980" y="-309" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">ends at</text><rect x="931.5" y="66" width="35" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="949" y="75" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">risks</text><rect x="1611.5" y="-215" width="35" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="1629" y="-206" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">risks</text><rect x="928" y="-230" width="64" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="960" y="-221" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">proven by</text><rect x="1280" y="-246" width="40" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="1300" y="-237" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">gates</text><g><rect x="0.0" y="0.0" width="220" height="119" rx="10" fill="#14141a" stroke="#b7bcc6" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="16.0" cy="20.0" r="4" fill="#b7bcc6"/><text x="26.0" y="20.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">CONTEXT</text><text x="12.0" y="48.0" font-size="14" font-weight="600" fill="#f1f1f7">Why move at all</text><text x="12.0" y="69.0" font-size="12" fill="#919198">The cost of staying put, in</text><text x="12.0" y="86.0" font-size="12" fill="#919198">numbers. A migration without</text><text x="12.0" y="103.0" font-size="12" fill="#919198">this gets abandoned halfway.</text></g><g><rect x="340.0" y="-21.0" width="220" height="161" rx="10" fill="#14141a" stroke="#9edaff" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="ring" cx="356.0" cy="-1.0" r="3.1" fill="none" stroke="#9edaff" stroke-width="1.8"/><text x="366.0" y="-1.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">GOAL</text><text x="352.0" y="27.0" font-size="14" font-weight="600" fill="#f1f1f7">Everything on the new</text><text x="352.0" y="46.0" font-size="14" font-weight="600" fill="#f1f1f7">system</text><text x="352.0" y="67.0" font-size="12" fill="#919198">With a date and a definition of</text><text x="352.0" y="84.0" font-size="12" fill="#919198">done that includes the old</text><text x="352.0" y="101.0" font-size="12" fill="#919198">system being switched off.</text><rect x="352.0" y="111.0" width="37" height="16" rx="3" fill="#1b1b21"/><text x="370.5" y="119.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">High</text></g><g><rect x="680.0" y="-292.0" width="220" height="142" rx="10" fill="#14141a" stroke="#5aae69" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="692.5" y="-275.5" width="7" height="7" rx="1.5" fill="#5aae69"/><text x="706.0" y="-272.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">REQUIREMENT</text><text x="692.0" y="-244.0" font-size="14" font-weight="600" fill="#f1f1f7">No data loss</text><text x="692.0" y="-223.0" font-size="12" fill="#919198">Reconciliation between old and</text><text x="692.0" y="-206.0" font-size="12" fill="#919198">new, run continuously, not once</text><text x="692.0" y="-189.0" font-size="12" fill="#919198">at the end.</text><rect x="692.0" y="-179.0" width="37" height="16" rx="3" fill="#1b1b21"/><text x="710.5" y="-171.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">High</text></g><g><rect x="680.0" y="167.0" width="220" height="142" rx="10" fill="#14141a" stroke="#5aae69" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="692.5" y="183.5" width="7" height="7" rx="1.5" fill="#5aae69"/><text x="706.0" y="187.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">REQUIREMENT</text><text x="692.0" y="215.0" font-size="14" font-weight="600" fill="#f1f1f7">Reversible at every step</text><text x="692.0" y="236.0" font-size="12" fill="#919198">Each phase can be rolled back</text><text x="692.0" y="253.0" font-size="12" fill="#919198">without a data migration in the</text><text x="692.0" y="270.0" font-size="12" fill="#919198">other direction.</text><rect x="692.0" y="280.0" width="37" height="16" rx="3" fill="#1b1b21"/><text x="710.5" y="288.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">High</text></g><g><rect x="340.0" y="188.0" width="220" height="162" rx="10" fill="#14141a" stroke="#d09aea" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 356.0 203.5 L 360.5 208.0 L 356.0 212.5 L 351.5 208.0 Z" fill="#d09aea"/><text x="366.0" y="208.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">ASSUMPTION</text><text x="352.0" y="236.0" font-size="14" font-weight="600" fill="#f1f1f7">The old system can run</text><text x="352.0" y="255.0" font-size="14" font-weight="600" fill="#f1f1f7">alongside the new one</text><text x="352.0" y="276.0" font-size="12" fill="#919198">The entire dual-running plan</text><text x="352.0" y="293.0" font-size="12" fill="#919198">depends on this. Check it</text><text x="352.0" y="310.0" font-size="12" fill="#919198">before anything else…</text></g><g><rect x="340.0" y="398.0" width="220" height="143" rx="10" fill="#14141a" stroke="#d09aea" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 356.0 413.5 L 360.5 418.0 L 356.0 422.5 L 351.5 418.0 Z" fill="#d09aea"/><text x="366.0" y="418.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">ASSUMPTION</text><text x="352.0" y="446.0" font-size="14" font-weight="600" fill="#f1f1f7">We know every consumer</text><text x="352.0" y="467.0" font-size="12" fill="#919198">There is always one more. Look</text><text x="352.0" y="484.0" font-size="12" fill="#919198">at access logs, not at the</text><text x="352.0" y="501.0" font-size="12" fill="#919198">documentation.</text></g><g><rect x="680.0" y="0.0" width="220" height="119" rx="10" fill="#14141a" stroke="#6cb3fd" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="696.0" cy="20.0" r="4" fill="#6cb3fd"/><text x="706.0" y="20.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">PROCESS</text><text x="692.0" y="48.0" font-size="14" font-weight="600" fill="#f1f1f7">Shadow-write to both</text><text x="692.0" y="69.0" font-size="12" fill="#919198">New system receives every</text><text x="692.0" y="86.0" font-size="12" fill="#919198">write, serves nothing. Cheap</text><text x="692.0" y="103.0" font-size="12" fill="#919198">way to find schema…</text></g><g><rect x="1020.0" y="-102.0" width="220" height="138" rx="10" fill="#14141a" stroke="#6cb3fd" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1036.0" cy="-82.0" r="4" fill="#6cb3fd"/><text x="1046.0" y="-82.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">PROCESS</text><text x="1032.0" y="-54.0" font-size="14" font-weight="600" fill="#f1f1f7">Read from new, fall back</text><text x="1032.0" y="-35.0" font-size="14" font-weight="600" fill="#f1f1f7">to old</text><text x="1032.0" y="-14.0" font-size="12" fill="#919198">Reads move first because they</text><text x="1032.0" y="3.0" font-size="12" fill="#919198">are the reversible half.</text><text x="1032.0" y="20.0" font-size="12" fill="#919198">Measure the fallback rate;…</text></g><g><rect x="1360.0" y="-281.0" width="220" height="119" rx="10" fill="#14141a" stroke="#6cb3fd" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1376.0" cy="-261.0" r="4" fill="#6cb3fd"/><text x="1386.0" y="-261.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">PROCESS</text><text x="1372.0" y="-233.0" font-size="14" font-weight="600" fill="#f1f1f7">Move writes</text><text x="1372.0" y="-212.0" font-size="12" fill="#919198">The point of no easy return. Do</text><text x="1372.0" y="-195.0" font-size="12" fill="#919198">it per tenant or per region,</text><text x="1372.0" y="-178.0" font-size="12" fill="#919198">never all at once.</text></g><g><rect x="1700.0" y="-378.0" width="220" height="138" rx="10" fill="#14141a" stroke="#6cb3fd" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1716.0" cy="-358.0" r="4" fill="#6cb3fd"/><text x="1726.0" y="-358.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">PROCESS</text><text x="1712.0" y="-330.0" font-size="14" font-weight="600" fill="#f1f1f7">Decommission the old</text><text x="1712.0" y="-311.0" font-size="14" font-weight="600" fill="#f1f1f7">system</text><text x="1712.0" y="-290.0" font-size="12" fill="#919198">Left undone, you now maintain</text><text x="1712.0" y="-273.0" font-size="12" fill="#919198">two systems forever. Put a date</text><text x="1712.0" y="-256.0" font-size="12" fill="#919198">on it in the same plan.</text></g><g><rect x="1020.0" y="84.0" width="220" height="138" rx="10" fill="#14141a" stroke="#f89d79" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1036.0 99.5 L 1040.5 104.0 L 1036.0 108.5 L 1031.5 104.0 Z" fill="#f89d79"/><text x="1046.0" y="104.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">RISK</text><text x="1032.0" y="132.0" font-size="14" font-weight="600" fill="#f1f1f7">Silent divergence between</text><text x="1032.0" y="151.0" font-size="14" font-weight="600" fill="#f1f1f7">the two</text><text x="1032.0" y="172.0" font-size="12" fill="#919198">Both accept writes, they drift,</text><text x="1032.0" y="189.0" font-size="12" fill="#919198">nobody notices for weeks.</text><text x="1032.0" y="206.0" font-size="12" fill="#919198">Reconciliation has to…</text></g><g><rect x="1700.0" y="-192.0" width="220" height="119" rx="10" fill="#14141a" stroke="#f89d79" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1716.0 -176.5 L 1720.5 -172.0 L 1716.0 -167.5 L 1711.5 -172.0 Z" fill="#f89d79"/><text x="1726.0" y="-172.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">RISK</text><text x="1712.0" y="-144.0" font-size="14" font-weight="600" fill="#f1f1f7">Cutover under load</text><text x="1712.0" y="-123.0" font-size="12" fill="#919198">What happens if the switch</text><text x="1712.0" y="-106.0" font-size="12" fill="#919198">lands during peak traffic, and</text><text x="1712.0" y="-89.0" font-size="12" fill="#919198">who is allowed to call it off.</text></g><g><rect x="340.0" y="589.0" width="220" height="119" rx="10" fill="#14141a" stroke="#73dea4" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="356.0" cy="609.0" r="4" fill="#73dea4"/><text x="366.0" y="609.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">DECISION</text><text x="352.0" y="637.0" font-size="14" font-weight="600" fill="#f1f1f7">Per-tenant, not big bang</text><text x="352.0" y="658.0" font-size="12" fill="#919198">Slower, and the only version</text><text x="352.0" y="675.0" font-size="12" fill="#919198">where the first failure is</text><text x="352.0" y="692.0" font-size="12" fill="#919198">survivable.</text></g><g><rect x="1020.0" y="-292.0" width="220" height="142" rx="10" fill="#14141a" stroke="#d1925a" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1032.5" y="-275.5" width="7" height="7" rx="1.5" fill="#d1925a"/><text x="1046.0" y="-272.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">OUTPUT</text><text x="1032.0" y="-244.0" font-size="14" font-weight="600" fill="#f1f1f7">Reconciliation report</text><text x="1032.0" y="-223.0" font-size="12" fill="#919198">Old versus new, per entity,</text><text x="1032.0" y="-206.0" font-size="12" fill="#919198">every day, with a threshold</text><text x="1032.0" y="-189.0" font-size="12" fill="#919198">that blocks the next phase.</text><rect x="1032.0" y="-179.0" width="37" height="16" rx="3" fill="#1b1b21"/><text x="1050.5" y="-171.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">High</text></g><g><rect x="2040.0" y="-369.0" width="220" height="119" rx="22" fill="#14141a" stroke="#cd7ab2" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="2056.0" cy="-349.0" r="4" fill="#cd7ab2"/><text x="2066.0" y="-349.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">TRIGGER / END</text><text x="2052.0" y="-321.0" font-size="14" font-weight="600" fill="#f1f1f7">Old system off</text><text x="2052.0" y="-300.0" font-size="12" fill="#919198">Powered down, not just unused.</text><text x="2052.0" y="-283.0" font-size="12" fill="#919198">Until then the migration is not</text><text x="2052.0" y="-266.0" font-size="12" fill="#919198">finished.</text></g></g><text x="48" y="1166" font-size="12" font-weight="600" fill="#bdbdc4">Migrate a system</text></svg>
