198">build you just ran, not…</text></g><g><rect x="1020.0" y="-122.0" width="220" height="162" rx="10" fill="#14141a" stroke="#d09aea" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1036.0 -106.5 L 1040.5 -102.0 L 1036.0 -97.5 L 1031.5 -102.0 Z" fill="#d09aea"/><text x="1046.0" y="-102.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">ASSUMPTION</text><text x="1032.0" y="-74.0" font-size="14" font-weight="600" fill="#f1f1f7">Tests cover the important</text><text x="1032.0" y="-55.0" font-size="14" font-weight="600" fill="#f1f1f7">paths</text><text x="1032.0" y="-34.0" font-size="12" fill="#919198">Coverage percentage is not the</text><text x="1032.0" y="-17.0" font-size="12" fill="#919198">answer. Ask whether the paths</text><text x="1032.0" y="0.0" font-size="12" fill="#919198">you just traced are covered…</text></g><g><rect x="1360.0" y="-465.0" width="220" height="119" rx="10" fill="#14141a" stroke="#d1925a" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1372.5" y="-448.5" width="7" height="7" rx="1.5" fill="#d1925a"/><text x="1386.0" y="-445.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">OUTPUT</text><text x="1372.0" y="-417.0" font-size="14" font-weight="600" fill="#f1f1f7">A map of the moving parts</text><text x="1372.0" y="-396.0" font-size="12" fill="#919198">Services, storage, jobs,</text><text x="1372.0" y="-379.0" font-size="12" fill="#919198">external calls, and which of</text><text x="1372.0" y="-362.0" font-size="12" fill="#919198">them you can restart…</text></g><g><rect x="1360.0" y="-298.0" width="220" height="138" rx="10" fill="#14141a" stroke="#d1925a" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1372.5" y="-281.5" width="7" height="7" rx="1.5" fill="#d1925a"/><text x="1386.0" y="-278.0" font-size="11" font-weight="600" le