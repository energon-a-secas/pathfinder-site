" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">informs</text><rect x="1954" y="-389" width="52" height="18" rx="9" fill="#14141a" stroke="#2d2d33" stroke-width="1"/><text x="1980" y="-380" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">enables</text><g><rect x="0.0" y="0.0" width="220" height="119" rx="22" fill="#14141a" stroke="#cd7ab2" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="16.0" cy="20.0" r="4" fill="#cd7ab2"/><text x="26.0" y="20.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">TRIGGER / END</text><text x="12.0" y="48.0" font-size="14" font-weight="600" fill="#f1f1f7">Handed the repo</text><text x="12.0" y="69.0" font-size="12" fill="#919198">What you were told it does, and</text><text x="12.0" y="86.0" font-size="12" fill="#919198">by whom. Keep it: you will want</text><text x="12.0" y="103.0" font-size="12" fill="#919198">to compare it against what…</text></g><g><rect x="340.0" y="-116.0" width="220" height="161" rx="10" fill="#14141a" stroke="#9edaff" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="ring" cx="356.0" cy="-96.0" r="3.1" fill="none" stroke="#9edaff" stroke-width="1.8"/><text x="366.0" y="-96.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">GOAL</text><text x="352.0" y="-68.0" font-size="14" font-weight="600" fill="#f1f1f7">Be able to make a safe</text><text x="352.0" y="-49.0" font-size="14" font-weight="600" fill="#f1f1f7">change</text><text x="352.0" y="-28.0" font-size="12" fill="#919198">Not &quot;understand everything&quot;.</text><text x="352.0" y="-11.0" font-size="12" fill="#919198">The bar is: change one thing</text><text x="352.0" y="6.0" font-size="12" fill="#919198">and know whether you…</text><rect x="352.0" y="16.0" width="37" height="16" rx="3" fill="#1b1b21"/><text x="370.5" y="24.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">High</text></g><g><rect x="1020.0" y="-274.0" width="220" height="119" rx="10" fill="#14141a" stroke="#6cb3fd" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1036.0" cy="-254.0" r="4" fill="#6cb3fd"/><text x="1046.0" y="-254.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">PROCESS</text><text x="1032.0" y="-226.0" font-size="14" font-weight="600" fill="#f1f1f7">Get it running locally</text><text x="1032.0" y="-205.0" font-size="12" fill="#919198">Build, run, and hit one real</text><text x="1032.0" y="-188.0" font-size="12" fill="#919198">endpoint or screen. Time-box</text><text x="1032.0" y="-171.0" font-size="12" fill="#919198">it, and write down…</text></g><g><rect x="680.0" y="-95.0" width="220" height="119" rx="10" fill="#14141a" stroke="#6cb3fd" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="696.0" cy="-75.0" r="4" fill="#6cb3fd"/><text x="706.0" y="-75.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">PROCESS</text><text x="692.0" y="-47.0" font-size="14" font-weight="600" fill="#f1f1f7">Run the test suite</text><text x="692.0" y="-26.0" font-size="12" fill="#919198">How long it takes, what fails</text><text x="692.0" y="-9.0" font-size="12" fill="#919198">on a clean checkout, and</text><text x="692.0" y="8.0" font-size="12" fill="#919198">whether anyone trusts it.…</text></g><g><rect x="680.0" y="62.0" width="220" height="138" rx="10" fill="#14141a" stroke="#6cb3fd" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="696.0" cy="82.0" r="4" fill="#6cb3fd"/><text x="706.0" y="82.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">PROCESS</text><text x="692.0" y="110.0" font-size="14" font-weight="600" fill="#f1f1f7">Trace one request end to</text><text x="692.0" y="129.0" font-size="14" font-weight="600" fill="#f1f1f7">end</text><text x="692.0" y="150.0" font-size="12" fill="#919198">Entry point to storage and</text><text x="692.0" y="167.0" font-size="12" fill="#919198">back. One real path teaches</text><text x="692.0" y="184.0" font-size="12" fill="#919198">more than a week of…</text></g><g><rect x="1020.0" y="83.0" width="220" height="138" rx="10" fill="#14141a" stroke="#2fa5d8" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1036.0 98.5 L 1040.5 103.0 L 1036.0 107.5 L 1031.5 103.0 Z" fill="#2fa5d8"/><text x="1046.0" y="103.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">OPEN QUESTION</text><text x="1032.0" y="131.0" font-size="14" font-weight="600" fill="#f1f1f7">Where does the money or</text><text x="1032.0" y="150.0" font-size="14" font-weight="600" fill="#f1f1f7">the risk live?</text><text x="1032.0" y="171.0" font-size="12" fill="#919198">Payments, auth, personal data,</text><text x="1032.0" y="188.0" font-size="12" fill="#919198">anything with a regulator</text><text x="1032.0" y="205.0" font-size="12" fill="#919198">attached. Find these…</text></g><g><rect x="340.0" y="83.0" width="220" height="143" rx="10" fill="#14141a" stroke="#d09aea" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 356.0 98.5 L 360.5 103.0 L 356.0 107.5 L 351.5 103.0 Z" fill="#d09aea"/><text x="366.0" y="103.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">ASSUMPTION</text><text x="352.0" y="131.0" font-size="14" font-weight="600" fill="#f1f1f7">The README is current</text><text x="352.0" y="152.0" font-size="12" fill="#919198">Usually written once at the</text><text x="352.0" y="169.0" font-size="12" fill="#919198">start. Check it against the</text><text x="352.0" y="186.0" font-size="12" fill="#919198">build you just ran, not…</text></g><g><rect x="1020.0" y="-117.0" width="220" height="162" rx="10" fill="#14141a" stroke="#d09aea" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1036.0 -101.5 L 1040.5 -97.0 L 1036.0 -92.5 L 1031.5 -97.0 Z" fill="#d09aea"/><text x="1046.0" y="-97.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">ASSUMPTION</text><text x="1032.0" y="-69.0" font-size="14" font-weight="600" fill="#f1f1f7">Tests cover the important</text><text x="1032.0" y="-50.0" font-size="14" font-weight="600" fill="#f1f1f7">paths</text><text x="1032.0" y="-29.0" font-size="12" fill="#919198">Coverage percentage is not the</text><text x="1032.0" y="-12.0" font-size="12" fill="#919198">answer. Ask whether the paths</text><text x="1032.0" y="5.0" font-size="12" fill="#919198">you just traced are covered…</text></g><g><rect x="1360.0" y="-440.0" width="220" height="119" rx="10" fill="#14141a" stroke="#d1925a" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1372.5" y="-423.5" width="7" height="7" rx="1.5" fill="#d1925a"/><text x="1386.0" y="-420.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">OUTPUT</text><text x="1372.0" y="-392.0" font-size="14" font-weight="600" fill="#f1f1f7">A map of the moving parts</text><text x="1372.0" y="-371.0" font-size="12" fill="#919198">Services, storage, jobs,</text><text x="1372.0" y="-354.0" font-size="12" fill="#919198">external calls, and which of</text><text x="1372.0" y="-337.0" font-size="12" fill="#919198">them you can restart…</text></g><g><rect x="1360.0" y="-283.0" width="220" height="138" rx="10" fill="#14141a" stroke="#d1925a" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1372.5" y="-266.5" width="7" height="7" rx="1.5" fill="#d1925a"/><text x="1386.0" y="-263.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">OUTPUT</text><text x="1372.0" y="-235.0" font-size="14" font-weight="600" fill="#f1f1f7">A list of what is</text><text x="1372.0" y="-216.0" font-size="14" font-weight="600" fill="#f1f1f7">undocumented</text><text x="1372.0" y="-195.0" font-size="12" fill="#919198">Every step you had to work out</text><text x="1372.0" y="-178.0" font-size="12" fill="#919198">yourself. This is the</text><text x="1372.0" y="-161.0" font-size="12" fill="#919198">highest-value thing a…</text></g><g><rect x="1360.0" y="-107.0" width="220" height="138" rx="10" fill="#14141a" stroke="#f89d79" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1376.0 -91.5 L 1380.5 -87.0 L 1376.0 -82.5 L 1371.5 -87.0 Z" fill="#f89d79"/><text x="1386.0" y="-87.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">RISK</text><text x="1372.0" y="-59.0" font-size="14" font-weight="600" fill="#f1f1f7">Change breaks something</text><text x="1372.0" y="-40.0" font-size="14" font-weight="600" fill="#f1f1f7">invisible</text><text x="1372.0" y="-19.0" font-size="12" fill="#919198">A cron, a downstream consumer,</text><text x="1372.0" y="-2.0" font-size="12" fill="#919198">a report someone reads on</text><text x="1372.0" y="15.0" font-size="12" fill="#919198">Mondays. Name what has no…</text></g><g><rect x="1700.0" y="-461.0" width="220" height="161" rx="10" fill="#14141a" stroke="#5aae69" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1712.5" y="-444.5" width="7" height="7" rx="1.5" fill="#5aae69"/><text x="1726.0" y="-441.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">REQUIREMENT</text><text x="1712.0" y="-413.0" font-size="14" font-weight="600" fill="#f1f1f7">A rollback you have</text><text x="1712.0" y="-394.0" font-size="14" font-weight="600" fill="#f1f1f7">actually tried</text><text x="1712.0" y="-373.0" font-size="12" fill="#919198">Deploying without a tested</text><text x="1712.0" y="-356.0" font-size="12" fill="#919198">rollback means the first change</text><text x="1712.0" y="-339.0" font-size="12" fill="#919198">is also the first outage.</text><rect x="1712.0" y="-329.0" width="37" height="16" rx="3" fill="#1b1b21"/><text x="1730.5" y="-321.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#bdbdc4">High</text></g><g><rect x="2040.0" y="-440.0" width="220" height="119" rx="22" fill="#14141a" stroke="#cd7ab2" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="2056.0" cy="-420.0" r="4" fill="#cd7ab2"/><text x="2066.0" y="-420.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#bdbdc4">TRIGGER / END</text><text x="2052.0" y="-392.0" font-size="14" font-weight="600" fill="#f1f1f7">First change shipped</text><text x="2052.0" y="-371.0" font-size="12" fill="#919198">Something small, reversible,</text><text x="2052.0" y="-354.0" font-size="12" fill="#919198">and observable. The point is</text><text x="2052.0" y="-337.0" font-size="12" fill="#919198">proving the loop works, not…</text></g></g><text x="48" y="767" font-size="12" font-weight="600" fill="#bdbdc4">Inherit a Codebase</text></svg>
