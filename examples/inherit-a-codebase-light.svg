dth="54" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1296" y="238" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">requires</text><rect x="1255" y="120" width="50" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1280" y="129" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">informs</text><line x1="1556" y1="141" x2="1556" y2="184" stroke="#73737d" stroke-width="1" stroke-dasharray="2 2"/><rect x="1530" y="184" width="52" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1556" y="193" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">enables</text><g><rect x="0.0" y="0.0" width="220" height="119" rx="22" fill="#fdfdff" stroke="#933a76" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="16.0" cy="20.0" r="4" fill="#933a76"/><text x="26.0" y="20.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">TRIGGER / END</text><text x="12.0" y="48.0" font-size="14" font-weight="600" fill="#1a1a20">Handed the repo</text><text x="12.0" y="69.0" font-size="12" fill="#62626a">What you were told it does, and</text><text x="12.0" y="86.0" font-size="12" fill="#62626a">by whom. Keep it: you will want</text><text x="12.0" y="103.0" font-size="12" fill="#62626a">to compare it against what…</text></g><g><rect x="260.0" y="0.0" width="220" height="161" rx="10" fill="#fdfdff" stroke="#046eb6" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="ring" cx="276.0" cy="20.0" r="3.1" fill="none" stroke="#046eb6" stroke-width="1.8"/><text x="286.0" y="20.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">GOAL</text><text x="272.0" y="48.0" font-size="14" font-weight="600" fill="#1a1a20">Be able to make a safe</text><text x="272.0" y="67.0" font-size="14" font-weight="600" fill="#1a1a20">change</text><text x="272.0" y="88.0" font-size="12" fill="#62626a">Not &quot;understand everything&quot;.</text><text x="272.0" y="105.0" font-size="12" fill="#62626a">The bar is: change one thing</text><text x="272.0" y="122.0" font-size="12" fill="#62626a">and know whether you…</text><rect x="272.0" y="132.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="290.5" y="140.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="520.0" y="-150.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="536.0" cy="-130.0" r="4" fill="#5181c7"/><text x="546.0" y="-130.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="532.0" y="-102.0" font-size="14" font-weight="600" fill="#1a1a20">Get it running locally</text><text x="532.0" y="-81.0" font-size="12" fill="#62626a">Build, run, and hit one real</text><text x="532.0" y="-64.0" font-size="12" fill="#62626a">endpoint or screen. Time-box</text><text x="532.0" y="-47.0" font-size="12" fill="#62626a">it, and write down…</text></g><g><rect x="520.0" y="-20.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="536.0" cy="0.0" r="4" fill="#5181c7"/><text x="546.0" y="0.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="532.0" y="28.0" font-size="14" font-weight="600" fill="#1a1a20">Run the test suite</text><text x="532.0" y="49.0" font-size="12" fill="#62626a">How long it takes, what fails</text><text x="532.0" y="66.0" font-size="12" fill="#62626a">on a clean checkout, and</text><text x="532.0" y="83.0" font-size="12" fill="#62626a">whether anyone trusts it.…</text></g><g><rect x="520.0" y="110.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="536.0" cy="130.0" r="4" fill="#5181c7"/><text x="546.0" y="130.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="532.0" y="158.0" font-size="14" font-weight="600" fill="#1a1a20">Trace one request end to</text><text x="532.0" y="177.0" font-size="14" font-weight="600" fill="#1a1a20">end</text><text x="532.0" y="198.0" font-size="12" fill="#62626a">Entry point to storage and</text><text x="532.0" y="215.0" font-size="12" fill="#62626a">back. One real path teaches</text><text x="532.0" y="232.0" font-size="12" fill="#62626a">more than a week of…</text></g><g><rect x="780.0" y="110.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#0a5e89" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 796.0 125.5 L 800.5 130.0 L 796.0 134.5 L 791.5 130.0 Z" fill="#0a5e89"/><text x="806.0" y="130.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">OPEN QUESTION</text><text x="792.0" y="158.0" font-size="14" font-weight="600" fill="#1a1a20">Where does the money or</text><text x="792.0" y="177.0" font-size="14" font-weight="600" fill="#1a1a20">the risk live?</text><text x="792.0" y="198.0" font-size="12" fill="#62626a">Payments, auth, personal data,</text><text x="792.0" y="215.0" font-size="12" fill="#62626a">anything with a regulator</text><text x="792.0" y="232.0" font-size="12" fill="#62626a">attached. Find these…</text></g><g><rect x="780.0" y="240.0" width="220" height="143" rx="10" fill="#fdfdff" stroke="#9b54ad" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 796.0 255.5 L 800.5 260.0 L 796.0 264.5 L 791.5 260.0 Z" fill="#9b54ad"/><text x="806.0" y="260.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">ASSUMPTION</text><text x="792.0" y="288.0" font-size="14" font-weight="600" fill="#1a1a20">The README is current</text><text x="792.0" y="309.0" font-size="12" fill="#62626a">Usually written once at the</text><text x="792.0" y="326.0" font-size="12" fill="#62626a">start. Check it against the</text><text x="792.0" y="343.0" font-size="12" fill="#62626a">build you just ran, not…</text></g><g><rect x="780.0" y="-20.0" width="220" height="162" rx="10" fill="#fdfdff" stroke="#9b54ad" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 796.0 -4.5 L 800.5 0.0 L 796.0 4.5 L 791.5 0.0 Z" fill="#9b54ad"/><text x="806.0" y="0.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">ASSUMPTION</text><text x="792.0" y="28.0" font-size="14" font-weight="600" fill="#1a1a20">Tests cover the important</text><text x="792.0" y="47.0" font-size="14" font-weight="600" fill="#1a1a20">paths</text><text x="792.0" y="68.0" font-size="12" fill="#62626a">Coverage percentage is not the</text><text x="792.0" y="85.0" font-size="12" fill="#62626a">answer. Ask whether the paths</text><text x="792.0" y="102.0" font-size="12" fill="#62626a">you just traced are covered…</text></g><g><rect x="1040.0" y="-80.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#935417" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1052.5" y="-63.5" width="7" height="7" rx="1.5" fill="#935417"/><text x="1066.0" y="-60.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">OUTPUT</text><text x="1052.0" y="-32.0" font-size="14" font-weight="600" fill="#1a1a20">A map of the moving parts</text><text x="1052.0" y="-11.0" font-size="12" fill="#62626a">Services, storage, jobs,</text><text x="1052.0" y="6.0" font-size="12" fill="#62626a">external calls, and which of</text><text x="1052.0" y="23.0" font-size="12" fill="#62626a">them you can restart…</text></g><g><rect x="1040.0" y="60.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#935417" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1052.5" y="76.5" width="7" height="7" rx="1.5" fill="#935417"/><text x="1066.0" y="80.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">OUTPUT</text><text x="1052.0" y="108.0" font-size="14" font-weight="600" fill="#1a1a20">A list of what is</text><text x="1052.0" y="127.0" font-size="14" font-weight="600" fill="#1a1a20">undocumented</text><text x="1052.0" y="148.0" font-size="12" fill="#62626a">Every step you had to work out</text><text x="1052.0" y="165.0" font-size="12" fill="#62626a">yourself. This is the</text><text x="1052.0" y="182.0" font-size="12" fill="#62626a">highest-value thing a…</text></g><g><rect x="1040.0" y="200.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#c85030" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1056.0 215.5 L 1060.5 220.0 L 1056.0 224.5 L 1051.5 220.0 Z" fill="#c85030"/><text x="1066.0" y="220.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">RISK</text><text x="1052.0" y="248.0" font-size="14" font-weight="600" fill="#1a1a20">Change breaks something</text><text x="1052.0" y="267.0" font-size="14" font-weight="600" fill="#1a1a20">invisible</text><text x="1052.0" y="288.0" font-size="12" fill="#62626a">A cron, a downstream consumer,</text><text x="1052.0" y="305.0" font-size="12" fill="#62626a">a report someone reads on</text><text x="1052.0" y="322.0" font-size="12" fill="#62626a">Mondays. Name what has no…</text></g><g><rect x="1300.0" y="60.0" width="220" height="161" rx="10" fill="#fdfdff" stroke="#268536" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1312.5" y="76.