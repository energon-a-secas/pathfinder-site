" text-anchor="middle" dominant-baseline="central" fill="#47474e">informs</text><rect x="1954" y="-389" width="52" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1980" y="-380" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">enables</text><g><rect x="0.0" y="0.0" width="220" height="119" rx="22" fill="#fdfdff" stroke="#933a76" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="16.0" cy="20.0" r="4" fill="#933a76"/><text x="26.0" y="20.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">TRIGGER / END</text><text x="12.0" y="48.0" font-size="14" font-weight="600" fill="#1a1a20">Handed the repo</text><text x="12.0" y="69.0" font-size="12" fill="#62626a">What you were told it does, and</text><text x="12.0" y="86.0" font-size="12" fill="#62626a">by whom. Keep it: you will want</text><text x="12.0" y="103.0" font-size="12" fill="#62626a">to compare it against what…</text></g><g><rect x="340.0" y="-116.0" width="220" height="161" rx="10" fill="#fdfdff" stroke="#046eb6" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="ring" cx="356.0" cy="-96.0" r="3.1" fill="none" stroke="#046eb6" stroke-width="1.8"/><text x="366.0" y="-96.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">GOAL</text><text x="352.0" y="-68.0" font-size="14" font-weight="600" fill="#1a1a20">Be able to make a safe</text><text x="352.0" y="-49.0" font-size="14" font-weight="600" fill="#1a1a20">change</text><text x="352.0" y="-28.0" font-size="12" fill="#62626a">Not &quot;understand everything&quot;.</text><text x="352.0" y="-11.0" font-size="12" fill="#62626a">The bar is: change one thing</text><text x="352.0" y="6.0" font-size="12" fill="#62626a">and know whether you…</text><rect x="352.0" y="16.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="370.5" y="24.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="1020.0" y="-274.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1036.0" cy="-254.0" r="4" fill="#5181c7"/><text x="1046.0" y="-254.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="1032.0" y="-226.0" font-size="14" font-weight="600" fill="#1a1a20">Get it running locally</text><text x="1032.0" y="-205.0" font-size="12" fill="#62626a">Build, run, and hit one real</text><text x="1032.0" y="-188.0" font-size="12" fill="#62626a">endpoint or screen. Time-box</text><text x="1032.0" y="-171.0" font-size="12" fill="#62626a">it, and write down…</text></g><g><rect x="680.0" y="-95.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="696.0" cy="-75.0" r="4" fill="#5181c7"/><text x="706.0" y="-75.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="692.0" y="-47.0" font-size="14" font-weight="600" fill="#1a1a20">Run the test suite</text><text x="692.0" y="-26.0" font-size="12" fill="#62626a">How long it takes, what fails</text><text x="692.0" y="-9.0" font-size="12" fill="#62626a">on a clean checkout, and</text><text x="692.0" y="8.0" font-size="12" fill="#62626a">whether anyone trusts it.…</text></g><g><rect x="680.0" y="62.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="696.0" cy="82.0" r="4" fill="#5181c7"/><text x="706.0" y="82.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="692.0" y="110.0" font-size="14" font-weight="600" fill="#1a1a20">Trace one request end to</text><text x="692.0" y="129.0" font-size="14" font-weight="600" fill="#1a1a20">end</text><text x="692.0" y="150.0" font-size="12" fill="#62626a">Entry point to storage and</text><text x="692.0" y="167.0" font-size="12" fill="#62626a">back. One real path teaches</text><text x="692.0" y="184.0" font-size="12" fill="#62626a">more than a week of…</text></g><g><rect x="1020.0" y="83.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#0a5e89" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1036.0 98.5 L 1040.5 103.0 L 1036.0 107.5 L 1031.5 103.0 Z" fill="#0a5e89"/><text x="1046.0" y="103.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">OPEN QUESTION</text><text x="1032.0" y="131.0" font-size="14" font-weight="600" fill="#1a1a20">Where does the money or</text><text x="1032.0" y="150.0" font-size="14" font-weight="600" fill="#1a1a20">the risk live?</text><text x="1032.0" y="171.0" font-size="12" fill="#62626a">Payments, auth, personal data,</text><text x="1032.0" y="188.0" font-size="12" fill="#62626a">anything with a regulator</text><text x="1032.0" y="205.0" font-size="12" fill="#62626a">attached. Find these…</text></g><g><rect x="340.0" y="83.0" width="220" height="143" rx="10" fill="#fdfdff" stroke="#9b54ad" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 356.0 98.5 L 360.5 103.0 L 356.0 107.5 L 351.5 103.0 Z" fill="#9b54ad"/><text x="366.0" y="103.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">ASSUMPTION</text><text x="352.0" y="131.0" font-size="14" font-weight="600" fill="#1a1a20">The README is current</text><text x="352.0" y="152.0" font-size="12" fill="#62626a">Usually written once at the</text><text x="352.0" y="169.0" font-size="12" fill="#62626a">start. Check it against the</text><text x="352.0" y="186.0" font-size="12" fill="#62626a">build you just ran, not…</text></g><g><rect x="1020.0" y="-117.0" width="220" height="162" rx="10" fill="#fdfdff" stroke="#9b54ad" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1036.0 -101.5 L 1040.5 -97.0 L 1036.0 -92.5 L 1031.5 -97.0 Z" fill="#9b54ad"/><text x="1046.0" y="-97.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">ASSUMPTION</text><text x="1032.0" y="-69.0" font-size="14" font-weight="600" fill="#1a1a20">Tests cover the important</text><text x="1032.0" y="-50.0" font-size="14" font-weight="600" fill="#1a1a20">paths</text><text x="1032.0" y="-29.0" font-size="12" fill="#62626a">Coverage percentage is not the</text><text x="1032.0" y="-12.0" font-size="12" fill="#62626a">answer. Ask whether the paths</text><text x="1032.0" y="5.0" font-size="12" fill="#62626a">you just traced are covered…</text></g><g><rect x="1360.0" y="-440.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#935417" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1372.5" y="-423.5" width="7" height="7" rx="1.5" fill="#935417"/><text x="1386.0" y="-420.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">OUTPUT</text><text x="1372.0" y="-392.0" font-size="14" font-weight="600" fill="#1a1a20">A map of the moving parts</text><text x="1372.0" y="-371.0" font-size="12" fill="#62626a">Services, storage, jobs,</text><text x="1372.0" y="-354.0" font-size="12" fill="#62626a">external calls, and which of</text><text x="1372.0" y="-337.0" font-size="12" fill="#62626a">them you can restart…</text></g><g><rect x="1360.0" y="-283.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#935417" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1372.5" y="-266.5" width="7" height="7" rx="1.5" fill="#935417"/><text x="1386.0" y="-263.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">OUTPUT</text><text x="1372.0" y="-235.0" font-size="14" font-weight="600" fill="#1a1a20">A list of what is</text><text x="1372.0" y="-216.0" font-size="14" font-weight="600" fill="#1a1a20">undocumented</text><text x="1372.0" y="-195.0" font-size="12" fill="#62626a">Every step you had to work out</text><text x="1372.0" y="-178.0" font-size="12" fill="#62626a">yourself. This is the</text><text x="1372.0" y="-161.0" font-size="12" fill="#62626a">highest-value thing a…</text></g><g><rect x="1360.0" y="-107.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#c85030" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1376.0 -91.5 L 1380.5 -87.0 L 1376.0 -82.5 L 1371.5 -87.0 Z" fill="#c85030"/><text x="1386.0" y="-87.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">RISK</text><text x="1372.0" y="-59.0" font-size="14" font-weight="600" fill="#1a1a20">Change breaks something</text><text x="1372.0" y="-40.0" font-size="14" font-weight="600" fill="#1a1a20">invisible</text><text x="1372.0" y="-19.0" font-size="12" fill="#62626a">A cron, a downstream consumer,</text><text x="1372.0" y="-2.0" font-size="12" fill="#62626a">a report someone reads on</text><text x="1372.0" y="15.0" font-size="12" fill="#62626a">Mondays. Name what has no…</text></g><g><rect x="1700.0" y="-461.0" width="220" height="161" rx="10" fill="#fdfdff" stroke="#268536" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1712.5" y="-444.5" width="7" height="7" rx="1.5" fill="#268536"/><text x="1726.0" y="-441.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">REQUIREMENT</text><text x="1712.0" y="-413.0" font-size="14" font-weight="600" fill="#1a1a20">A rollback you have</text><text x="1712.0" y="-394.0" font-size="14" font-weight="600" fill="#1a1a20">actually tried</text><text x="1712.0" y="-373.0" font-size="12" fill="#62626a">Deploying without a tested</text><text x="1712.0" y="-356.0" font-size="12" fill="#62626a">rollback means the first change</text><text x="1712.0" y="-339.0" font-size="12" fill="#62626a">is also the first outage.</text><rect x="1712.0" y="-329.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="1730.5" y="-321.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="2040.0" y="-440.0" width="220" height="119" rx="22" fill="#fdfdff" stroke="#933a76" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="2056.0" cy="-420.0" r="4" fill="#933a76"/><text x="2066.0" y="-420.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">TRIGGER / END</text><text x="2052.0" y="-392.0" font-size="14" font-weight="600" fill="#1a1a20">First change shipped</text><text x="2052.0" y="-371.0" font-size="12" fill="#62626a">Something small, reversible,</text><text x="2052.0" y="-354.0" font-size="12" fill="#62626a">and observable. The point is</text><text x="2052.0" y="-337.0" font-size="12" fill="#62626a">proving the loop works, not…</text></g></g><text x="48" y="767" font-size="12" font-weight="600" fill="#47474e">Inherit a Codebase</text></svg>
