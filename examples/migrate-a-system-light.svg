<svg xmlns="http://www.w3.org/2000/svg" width="2356" height="1132" viewBox="0 0 2356 1132" font-family="Avenir Next, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"><defs><marker id="ah-_2373737d-100" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7.2" preserveAspectRatio="none" refX="6" refY="5" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10 2.5,5" fill="#73737d"/></marker></defs><rect x="0" y="0" width="2356" height="1132" fill="#f1f1f7"/><g transform="translate(48.0,546.0)"><path d="M 220 -80 L 334 -80" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 560 -114 L 650 -114 Q 658 -114 658 -122 L 658 -338 Q 658 -346 666 -346 L 674 -346" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 560 -47 L 650 -47 Q 658 -47 658 -39 L 658 52 Q 658 60 666 60 L 674 60" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 560 88 L 674 88" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 560 310 L 650 310 Q 658 310 658 302 L 658 125 Q 658 117 666 117 L 674 117" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 450 419 L 450 405 Q 450 397 458 397 L 782 397 Q 790 397 790 389 L 790 165" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 560 -80 L 674 -80" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 900 -96 L 990 -96 Q 998 -96 998 -104 L 998 -160 Q 998 -168 1006 -168 L 1014 -168" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1240 -168 L 1330 -168 Q 1338 -168 1338 -176 L 1338 -323 Q 1338 -331 1346 -331 L 1354 -331" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1580 -362 L 1670 -362 Q 1678 -362 1678 -370 L 1678 -421 Q 1678 -429 1686 -429 L 1694 -429" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1920 -429 L 2034 -429" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 900 -65 L 990 -65 Q 998 -65 998 -57 L 998 0 Q 998 8 1006 8 L 1014 8" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1580 -331 L 1670 -331 Q 1678 -331 1678 -323 L 1678 -270 Q 1678 -262 1686 -262 L 1694 -262" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 900 -346 L 1014 -346" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1240 -362 L 1354 -362" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><rect x="249" y="-89" width="62" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="280" y="-80" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">motivates</text><rect x="631" y="-239" width="54" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="658" y="-230" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">requires</text><rect x="631" y="-6" width="54" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="658" y="3" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">requires</text><rect x="588" y="79" width="64" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="620" y="88" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">underpins</text><rect x="626" y="205" width="64" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="658" y="214" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">underpins</text><rect x="594" y="388" width="52" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="620" y="397" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">satisfies</text><rect x="588.5" y="-89" width="63" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="620" y="-80" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">starts with</text><rect x="931.5" y="-105" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="949" y="-96" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">then</text><rect x="1320.5" y="-258" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1338" y="-249" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">then</text><rect x="1611.5" y="-371" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1629" y="-362" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">then</text><rect x="1955.5" y="-438" width="49" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1980" y="-429" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">ends at</text><rect x="931.5" y="-74" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="949" y="-65" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">risks</text><rect x="1611.5" y="-340" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1629" y="-331" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">risks</text><rect x="928" y="-355" width="64" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="960" y="-346" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">proven by</text><rect x="1280" y="-371" width="40" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1300" y="-362" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">gates</text><g><rect x="0.0" y="-140.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#646975" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="16.0" cy="-120.0" r="4" fill="#646975"/><text x="26.0" y="-120.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">CONTEXT</text><text x="12.0" y="-92.0" font-size="14" font-weight="600" fill="#1a1a20">Why move at all</text><text x="12.0" y="-71.0" font-size="12" fill="#62626a">The cost of staying put, in</text><text x="12.0" y="-54.0" font-size="12" fill="#62626a">numbers. A migration without</text><text x="12.0" y="-37.0" font-size="12" fill="#62626a">this gets abandoned halfway.</text></g><g><rect x="340.0" y="-161.0" width="220" height="161" rx="10" fill="#fdfdff" stroke="#046eb6" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="ring" cx="356.0" cy="-141.0" r="3.1" fill="none" stroke="#046eb6" stroke-width="1.8"/><text x="366.0" y="-141.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">GOAL</text><text x="352.0" y="-113.0" font-size="14" font-weight="600" fill="#1a1a20">Everything on the new</text><text x="352.0" y="-94.0" font-size="14" font-weight="600" fill="#1a1a20">system</text><text x="352.0" y="-73.0" font-size="12" fill="#62626a">With a date and a definition of</text><text x="352.0" y="-56.0" font-size="12" fill="#62626a">done that includes the old</text><text x="352.0" y="-39.0" font-size="12" fill="#62626a">system being switched off.</text><rect x="352.0" y="-29.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="370.5" y="-21.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="680.0" y="-417.0" width="220" height="142" rx="10" fill="#fdfdff" stroke="#268536" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="692.5" y="-400.5" width="7" height="7" rx="1.5" fill="#268536"/><text x="706.0" y="-397.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">REQUIREMENT</text><text x="692.0" y="-369.0" font-size="14" font-weight="600" fill="#1a1a20">No data loss</text><text x="692.0" y="-348.0" font-size="12" fill="#62626a">Reconciliation between old and</text><text x="692.0" y="-331.0" font-size="12" fill="#62626a">new, run continuously, not once</text><text x="692.0" y="-314.0" font-size="12" fill="#62626a">at the end.</text><rect x="692.0" y="-304.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="710.5" y="-296.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="680.0" y="17.0" width="220" height="142" rx="10" fill="#fdfdff" stroke="#268536" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="692.5" y="33.5" width="7" height="7" rx="1.5" fill="#268536"/><text x="706.0" y="37.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">REQUIREMENT</text><text x="692.0" y="65.0" font-size="14" font-weight="600" fill="#1a1a20">Reversible at every step</text><text x="692.0" y="86.0" font-size="12" fill="#62626a">Each phase can be rolled back</text><text x="692.0" y="103.0" font-size="12" fill="#62626a">without a data migration in the</text><text x="692.0" y="120.0" font-size="12" fill="#62626a">other direction.</text><rect x="692.0" y="130.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="710.5" y="138.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="340.0" y="38.0" width="220" height="162" rx="10" fill="#fdfdff" stroke="#9b54ad" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 356.0 53.5 L 360.5 58.0 L 356.0 62.5 L 351.5 58.0 Z" fill="#9b54ad"/><text x="366.0" y="58.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">ASSUMPTION</text><text x="352.0" y="86.0" font-size="14" font-weight="600" fill="#1a1a20">The old system can run</text><text x="352.0" y="105.0" font-size="14" font-weight="600" fill="#1a1a20">alongside the new one</text><text x="352.0" y="126.0" font-size="12" fill="#62626a">The entire dual-running plan</text><text x="352.0" y="143.0" font-size="12" fill="#62626a">depends on this. Check it</text><text x="352.0" y="160.0" font-size="12" fill="#62626a">before anything else…</text></g><g><rect x="340.0" y="238.0" width="220" height="143" rx="10" fill="#fdfdff" stroke="#9b54ad" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 356.0 253.5 L 360.5 258.0 L 356.0 262.5 L 351.5 258.0 Z" fill="#9b54ad"/><text x="366.0" y="258.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">ASSUMPTION</text><text x="352.0" y="286.0" font-size="14" font-weight="600" fill="#1a1a20">We know every consumer</text><text x="352.0" y="307.0" font-size="12" fill="#62626a">There is always one more. Look</text><text x="352.0" y="324.0" font-size="12" fill="#62626a">at access logs, not at the</text><text x="352.0" y="341.0" font-size="12" fill="#62626a">documentation.</text></g><g><rect x="680.0" y="-140.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="696.0" cy="-120.0" r="4" fill="#5181c7"/><text x="706.0" y="-120.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="692.0" y="-92.0" font-size="14" font-weight="600" fill="#1a1a20">Shadow-write to both</text><text x="692.0" y="-71.0" font-size="12" fill="#62626a">New system receives every</text><text x="692.0" y="-54.0" font-size="12" fill="#62626a">write, serves nothing. Cheap</text><text x="692.0" y="-37.0" font-size="12" fill="#62626a">way to find schema…</text></g><g><rect x="1020.0" y="-237.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1036.0" cy="-217.0" r="4" fill="#5181c7"/><text x="1046.0" y="-217.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="1032.0" y="-189.0" font-size="14" font-weight="600" fill="#1a1a20">Read from new, fall back</text><text x="1032.0" y="-170.0" font-size="14" font-weight="600" fill="#1a1a20">to old</text><text x="1032.0" y="-149.0" font-size="12" fill="#62626a">Reads move first because they</text><text x="1032.0" y="-132.0" font-size="12" fill="#62626a">are the reversible half.</text><text x="1032.0" y="-115.0" font-size="12" fill="#62626a">Measure the fallback rate;…</text></g><g><rect x="1360.0" y="-406.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1376.0" cy="-386.0" r="4" fill="#5181c7"/><text x="1386.0" y="-386.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="1372.0" y="-358.0" font-size="14" font-weight="600" fill="#1a1a20">Move writes</text><text x="1372.0" y="-337.0" font-size="12" fill="#62626a">The point of no easy return. Do</text><text x="1372.0" y="-320.0" font-size="12" fill="#62626a">it per tenant or per region,</text><text x="1372.0" y="-303.0" font-size="12" fill="#62626a">never all at once.</text></g><g><rect x="1700.0" y="-498.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1716.0" cy="-478.0" r="4" fill="#5181c7"/><text x="1726.0" y="-478.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="1712.0" y="-450.0" font-size="14" font-weight="600" fill="#1a1a20">Decommission the old</text><text x="1712.0" y="-431.0" font-size="14" font-weight="600" fill="#1a1a20">system</text><text x="1712.0" y="-410.0" font-size="12" fill="#62626a">Left undone, you now maintain</text><text x="1712.0" y="-393.0" font-size="12" fill="#62626a">two systems forever. Put a date</text><text x="1712.0" y="-376.0" font-size="12" fill="#62626a">on it in the same plan.</text></g><g><rect x="1020.0" y="-61.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#c85030" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1036.0 -45.5 L 1040.5 -41.0 L 1036.0 -36.5 L 1031.5 -41.0 Z" fill="#c85030"/><text x="1046.0" y="-41.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">RISK</text><text x="1032.0" y="-13.0" font-size="14" font-weight="600" fill="#1a1a20">Silent divergence between</text><text x="1032.0" y="6.0" font-size="14" font-weight="600" fill="#1a1a20">the two</text><text x="1032.0" y="27.0" font-size="12" fill="#62626a">Both accept writes, they drift,</text><text x="1032.0" y="44.0" font-size="12" fill="#62626a">nobody notices for weeks.</text><text x="1032.0" y="61.0" font-size="12" fill="#62626a">Reconciliation has to…</text></g><g><rect x="1700.0" y="-322.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#c85030" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1716.0 -306.5 L 1720.5 -302.0 L 1716.0 -297.5 L 1711.5 -302.0 Z" fill="#c85030"/><text x="1726.0" y="-302.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">RISK</text><text x="1712.0" y="-274.0" font-size="14" font-weight="600" fill="#1a1a20">Cutover under load</text><text x="1712.0" y="-253.0" font-size="12" fill="#62626a">What happens if the switch</text><text x="1712.0" y="-236.0" font-size="12" fill="#62626a">lands during peak traffic, and</text><text x="1712.0" y="-219.0" font-size="12" fill="#62626a">who is allowed to call it off.</text></g><g><rect x="340.0" y="419.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#20683c" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="356.0" cy="439.0" r="4" fill="#20683c"/><text x="366.0" y="439.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">DECISION</text><text x="352.0" y="467.0" font-size="14" font-weight="600" fill="#1a1a20">Per-tenant, not big bang</text><text x="352.0" y="488.0" font-size="12" fill="#62626a">Slower, and the only version</text><text x="352.0" y="505.0" font-size="12" fill="#62626a">where the first failure is</text><text x="352.0" y="522.0" font-size="12" fill="#62626a">survivable.</text></g><g><rect x="1020.0" y="-417.0" width="220" height="142" rx="10" fill="#fdfdff" stroke="#935417" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1032.5" y="-400.5" width="7" height="7" rx="1.5" fill="#935417"/><text x="1046.0" y="-397.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">OUTPUT</text><text x="1032.0" y="-369.0" font-size="14" font-weight="600" fill="#1a1a20">Reconciliation report</text><text x="1032.0" y="-348.0" font-size="12" fill="#62626a">Old versus new, per entity,</text><text x="1032.0" y="-331.0" font-size="12" fill="#62626a">every day, with a threshold</text><text x="1032.0" y="-314.0" font-size="12" fill="#62626a">that blocks the next phase.</text><rect x="1032.0" y="-304.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="1050.5" y="-296.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="2040.0" y="-489.0" width="220" height="119" rx="22" fill="#fdfdff" stroke="#933a76" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="2056.0" cy="-469.0" r="4" fill="#933a76"/><text x="2066.0" y="-469.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">TRIGGER / END</text><text x="2052.0" y="-441.0" font-size="14" font-weight="600" fill="#1a1a20">Old system off</text><text x="2052.0" y="-420.0" font-size="12" fill="#62626a">Powered down, not just unused.</text><text x="2052.0" y="-403.0" font-size="12" fill="#62626a">Until then the migration is not</text><text x="2052.0" y="-386.0" font-size="12" fill="#62626a">finished.</text></g></g><text x="48" y="1116" font-size="12" font-weight="600" fill="#47474e">Migrate a System</text></svg>
