<svg xmlns="http://www.w3.org/2000/svg" width="1916" height="639" viewBox="0 0 1916 639" font-family="Avenir Next, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"><defs><marker id="ah-_2373737d-100" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7.2" preserveAspectRatio="none" refX="6" refY="5" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10 2.5,5" fill="#73737d"/></marker></defs><rect x="0" y="0" width="1916" height="639" fill="#f1f1f7"/><g transform="translate(48.0,188.0)"><path d="M 110 -21 L 110 14" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 220 67 L 241 67 Q 249 67 249 59 L 249 -61 Q 249 -69 257 -69 L 274 -69" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 220 134 L 251 134 Q 259 134 259 126 L 259 68 Q 259 61 266 61 L 274 61" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 390 130 L 390 131" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 500 332 L 509 332 Q 517 332 517 324 L 517 85 Q 517 80 512 80 L 506 80" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 560 130 L 535 130 Q 527 130 527 122 L 527 50 Q 527 42 519 42 L 506 42" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 220 101 L 261 101 Q 269 101 269 93 L 269 -150 Q 269 -158 277 -158 L 527 -158 Q 535 -158 535 -150 L 535 -28 Q 535 -20 543 -20 L 554 -20" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 780 -36 L 814 -36" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1040 -11 L 1074 -11" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1300 -36 L 1334 -36" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1560 -11 L 1594 -11" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 780 -5 L 792 -5 Q 800 -5 800 3 L 800 132 Q 800 139 807 139 L 814 139" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1190 39 L 1190 64" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 500 -69 L 537 -69 Q 545 -69 545 -77 L 545 -90 Q 545 -98 553 -98 L 1316 -98 Q 1324 -98 1324 -90 L 1324 117 Q 1324 122 1329 122 L 1334 122" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><path d="M 1340 160 L 1322 160 Q 1314 160 1314 152 L 1314 -1 Q 1314 -5 1310 -5 L 1306 -5" fill="none" stroke="#73737d" stroke-width="1.5" marker-end="url(#ah-_2373737d-100)"/><rect x="79" y="-9" width="62" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="110" y="0" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">motivates</text><rect x="206" y="-10" width="54" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="233" y="-1" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">requires</text><line x1="240" y1="134" x2="240" y2="189" stroke="#73737d" stroke-width="1" stroke-dasharray="2 2"/><rect x="213" y="189" width="54" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="240" y="198" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">requires</text><rect x="358" y="122" width="64" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="390" y="131" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">underpins</text><rect x="513" y="197" width="64" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="545" y="206" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">underpins</text><rect x="517" y="45" width="52" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="543" y="54" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">satisfies</text><rect x="370.5" y="-167" width="63" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="402" y="-158" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">starts with</text><line x1="800" y1="-36" x2="800" y2="-91" stroke="#73737d" stroke-width="1" stroke-dasharray="2 2"/><rect x="782.5" y="-109" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="800" y="-100" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">then</text><line x1="1068" y1="-11" x2="1068" y2="44" stroke="#73737d" stroke-width="1" stroke-dasharray="2 2"/><rect x="1050.5" y="44" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1068" y="53" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">then</text><line x1="1320" y1="-36" x2="1320" y2="-91" stroke="#73737d" stroke-width="1" stroke-dasharray="2 2"/><rect x="1302.5" y="-109" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1320" y="-100" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">then</text><line x1="1588" y1="-11" x2="1588" y2="44" stroke="#73737d" stroke-width="1" stroke-dasharray="2 2"/><rect x="1563.5" y="44" width="49" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1588" y="53" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">ends at</text><rect x="782.5" y="58" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="800" y="67" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">risks</text><rect x="1172.5" y="46" width="35" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1190" y="55" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">risks</text><rect x="903" y="-107" width="64" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="935" y="-98" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">proven by</text><rect x="1278" y="49" width="40" height="18" rx="9" fill="#fdfdff" stroke="#d6d7de" stroke-width="1"/><text x="1298" y="58" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#47474e">gates</text><g><rect x="0.0" y="-140.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#646975" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="16.0" cy="-120.0" r="4" fill="#646975"/><text x="26.0" y="-120.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">CONTEXT</text><text x="12.0" y="-92.0" font-size="14" font-weight="600" fill="#1a1a20">Why move at all</text><text x="12.0" y="-71.0" font-size="12" fill="#62626a">The cost of staying put, in</text><text x="12.0" y="-54.0" font-size="12" fill="#62626a">numbers. A migration without</text><text x="12.0" y="-37.0" font-size="12" fill="#62626a">this gets abandoned halfway.</text></g><g><rect x="0.0" y="20.0" width="220" height="161" rx="10" fill="#fdfdff" stroke="#046eb6" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="ring" cx="16.0" cy="40.0" r="3.1" fill="none" stroke="#046eb6" stroke-width="1.8"/><text x="26.0" y="40.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">GOAL</text><text x="12.0" y="68.0" font-size="14" font-weight="600" fill="#1a1a20">Everything on the new</text><text x="12.0" y="87.0" font-size="14" font-weight="600" fill="#1a1a20">system</text><text x="12.0" y="108.0" font-size="12" fill="#62626a">With a date and a definition of</text><text x="12.0" y="125.0" font-size="12" fill="#62626a">done that includes the old</text><text x="12.0" y="142.0" font-size="12" fill="#62626a">system being switched off.</text><rect x="12.0" y="152.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="30.5" y="160.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="280.0" y="-140.0" width="220" height="142" rx="10" fill="#fdfdff" stroke="#268536" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="292.5" y="-123.5" width="7" height="7" rx="1.5" fill="#268536"/><text x="306.0" y="-120.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">REQUIREMENT</text><text x="292.0" y="-92.0" font-size="14" font-weight="600" fill="#1a1a20">No data loss</text><text x="292.0" y="-71.0" font-size="12" fill="#62626a">Reconciliation between old and</text><text x="292.0" y="-54.0" font-size="12" fill="#62626a">new, run continuously, not once</text><text x="292.0" y="-37.0" font-size="12" fill="#62626a">at the end.</text><rect x="292.0" y="-27.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="310.5" y="-19.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="280.0" y="-10.0" width="220" height="142" rx="10" fill="#fdfdff" stroke="#268536" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="292.5" y="6.5" width="7" height="7" rx="1.5" fill="#268536"/><text x="306.0" y="10.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">REQUIREMENT</text><text x="292.0" y="38.0" font-size="14" font-weight="600" fill="#1a1a20">Reversible at every step</text><text x="292.0" y="59.0" font-size="12" fill="#62626a">Each phase can be rolled back</text><text x="292.0" y="76.0" font-size="12" fill="#62626a">without a data migration in the</text><text x="292.0" y="93.0" font-size="12" fill="#62626a">other direction.</text><rect x="292.0" y="103.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="310.5" y="111.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="280.0" y="130.0" width="220" height="162" rx="10" fill="#fdfdff" stroke="#9b54ad" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 296.0 145.5 L 300.5 150.0 L 296.0 154.5 L 291.5 150.0 Z" fill="#9b54ad"/><text x="306.0" y="150.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">ASSUMPTION</text><text x="292.0" y="178.0" font-size="14" font-weight="600" fill="#1a1a20">The old system can run</text><text x="292.0" y="197.0" font-size="14" font-weight="600" fill="#1a1a20">alongside the new one</text><text x="292.0" y="218.0" font-size="12" fill="#62626a">The entire dual-running plan</text><text x="292.0" y="235.0" font-size="12" fill="#62626a">depends on this. Check it</text><text x="292.0" y="252.0" font-size="12" fill="#62626a">before anything else…</text></g><g><rect x="280.0" y="260.0" width="220" height="143" rx="10" fill="#fdfdff" stroke="#9b54ad" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 296.0 275.5 L 300.5 280.0 L 296.0 284.5 L 291.5 280.0 Z" fill="#9b54ad"/><text x="306.0" y="280.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">ASSUMPTION</text><text x="292.0" y="308.0" font-size="14" font-weight="600" fill="#1a1a20">We know every consumer</text><text x="292.0" y="329.0" font-size="12" fill="#62626a">There is always one more. Look</text><text x="292.0" y="346.0" font-size="12" fill="#62626a">at access logs, not at the</text><text x="292.0" y="363.0" font-size="12" fill="#62626a">documentation.</text></g><g><rect x="560.0" y="-80.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="576.0" cy="-60.0" r="4" fill="#5181c7"/><text x="586.0" y="-60.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="572.0" y="-32.0" font-size="14" font-weight="600" fill="#1a1a20">Shadow-write to both</text><text x="572.0" y="-11.0" font-size="12" fill="#62626a">New system receives every</text><text x="572.0" y="6.0" font-size="12" fill="#62626a">write, serves nothing. Cheap</text><text x="572.0" y="23.0" font-size="12" fill="#62626a">way to find schema…</text></g><g><rect x="820.0" y="-80.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="836.0" cy="-60.0" r="4" fill="#5181c7"/><text x="846.0" y="-60.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="832.0" y="-32.0" font-size="14" font-weight="600" fill="#1a1a20">Read from new, fall back</text><text x="832.0" y="-13.0" font-size="14" font-weight="600" fill="#1a1a20">to old</text><text x="832.0" y="8.0" font-size="12" fill="#62626a">Reads move first because they</text><text x="832.0" y="25.0" font-size="12" fill="#62626a">are the reversible half.</text><text x="832.0" y="42.0" font-size="12" fill="#62626a">Measure the fallback rate;…</text></g><g><rect x="1080.0" y="-80.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1096.0" cy="-60.0" r="4" fill="#5181c7"/><text x="1106.0" y="-60.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="1092.0" y="-32.0" font-size="14" font-weight="600" fill="#1a1a20">Move writes</text><text x="1092.0" y="-11.0" font-size="12" fill="#62626a">The point of no easy return. Do</text><text x="1092.0" y="6.0" font-size="12" fill="#62626a">it per tenant or per region,</text><text x="1092.0" y="23.0" font-size="12" fill="#62626a">never all at once.</text></g><g><rect x="1340.0" y="-80.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#5181c7" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1356.0" cy="-60.0" r="4" fill="#5181c7"/><text x="1366.0" y="-60.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">PROCESS</text><text x="1352.0" y="-32.0" font-size="14" font-weight="600" fill="#1a1a20">Decommission the old</text><text x="1352.0" y="-13.0" font-size="14" font-weight="600" fill="#1a1a20">system</text><text x="1352.0" y="8.0" font-size="12" fill="#62626a">Left undone, you now maintain</text><text x="1352.0" y="25.0" font-size="12" fill="#62626a">two systems forever. Put a date</text><text x="1352.0" y="42.0" font-size="12" fill="#62626a">on it in the same plan.</text></g><g><rect x="820.0" y="70.0" width="220" height="138" rx="10" fill="#fdfdff" stroke="#c85030" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 836.0 85.5 L 840.5 90.0 L 836.0 94.5 L 831.5 90.0 Z" fill="#c85030"/><text x="846.0" y="90.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">RISK</text><text x="832.0" y="118.0" font-size="14" font-weight="600" fill="#1a1a20">Silent divergence between</text><text x="832.0" y="137.0" font-size="14" font-weight="600" fill="#1a1a20">the two</text><text x="832.0" y="158.0" font-size="12" fill="#62626a">Both accept writes, they drift,</text><text x="832.0" y="175.0" font-size="12" fill="#62626a">nobody notices for weeks.</text><text x="832.0" y="192.0" font-size="12" fill="#62626a">Reconciliation has to…</text></g><g><rect x="1080.0" y="70.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#c85030" stroke-opacity="0.5" stroke-width="1.5"/><path class="type-dot" data-shape="diamond" d="M 1096.0 85.5 L 1100.5 90.0 L 1096.0 94.5 L 1091.5 90.0 Z" fill="#c85030"/><text x="1106.0" y="90.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">RISK</text><text x="1092.0" y="118.0" font-size="14" font-weight="600" fill="#1a1a20">Cutover under load</text><text x="1092.0" y="139.0" font-size="12" fill="#62626a">What happens if the switch</text><text x="1092.0" y="156.0" font-size="12" fill="#62626a">lands during peak traffic, and</text><text x="1092.0" y="173.0" font-size="12" fill="#62626a">who is allowed to call it off.</text></g><g><rect x="560.0" y="70.0" width="220" height="119" rx="10" fill="#fdfdff" stroke="#20683c" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="576.0" cy="90.0" r="4" fill="#20683c"/><text x="586.0" y="90.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">DECISION</text><text x="572.0" y="118.0" font-size="14" font-weight="600" fill="#1a1a20">Per-tenant, not big bang</text><text x="572.0" y="139.0" font-size="12" fill="#62626a">Slower, and the only version</text><text x="572.0" y="156.0" font-size="12" fill="#62626a">where the first failure is</text><text x="572.0" y="173.0" font-size="12" fill="#62626a">survivable.</text></g><g><rect x="1340.0" y="70.0" width="220" height="142" rx="10" fill="#fdfdff" stroke="#935417" stroke-opacity="0.5" stroke-width="1.5"/><rect class="type-dot" data-shape="square" x="1352.5" y="86.5" width="7" height="7" rx="1.5" fill="#935417"/><text x="1366.0" y="90.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">OUTPUT</text><text x="1352.0" y="118.0" font-size="14" font-weight="600" fill="#1a1a20">Reconciliation report</text><text x="1352.0" y="139.0" font-size="12" fill="#62626a">Old versus new, per entity,</text><text x="1352.0" y="156.0" font-size="12" fill="#62626a">every day, with a threshold</text><text x="1352.0" y="173.0" font-size="12" fill="#62626a">that blocks the next phase.</text><rect x="1352.0" y="183.0" width="37" height="16" rx="3" fill="#eaeaf0"/><text x="1370.5" y="191.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#47474e">High</text></g><g><rect x="1600.0" y="-80.0" width="220" height="119" rx="22" fill="#fdfdff" stroke="#933a76" stroke-opacity="0.5" stroke-width="1.5"/><circle class="type-dot" data-shape="dot" cx="1616.0" cy="-60.0" r="4" fill="#933a76"/><text x="1626.0" y="-60.0" font-size="11" font-weight="600" letter-spacing="0.4" dominant-baseline="central" fill="#47474e">TRIGGER / END</text><text x="1612.0" y="-32.0" font-size="14" font-weight="600" fill="#1a1a20">Old system off</text><text x="1612.0" y="-11.0" font-size="12" fill="#62626a">Powered down, not just unused.</text><text x="1612.0" y="6.0" font-size="12" fill="#62626a">Until then the migration is not</text><text x="1612.0" y="23.0" font-size="12" fill="#62626a">finished.</text></g></g><text x="48" y="623" font-size="12" font-weight="600" fill="#47474e">Migrate a System</text></svg>
