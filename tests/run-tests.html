<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pathfinder Test Suite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- The trace tests parse real YAML through the app's own loader, so the
       runner needs the same parser the trace page loads. -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.3.2/dist/js-yaml.min.js" integrity="sha384-uwLg6oO8ZhFG2SuQfgmkMtosjtrFYlkPspa/cXS+b3D8GLRTHMDl/mTwqImdlKQO" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    #report { padding: 20px; }
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #94a3b8;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

<!-- Minimal DOM stubs required by source modules that reference elements via $() -->
<div id="canvasViewport" style="display:none">
  <div id="canvasRoot"></div>
</div>
<svg id="arrowsLayer" style="display:none">
  <g id="arrowsGroup"></g>
  <path id="arrowPreview"></path>
</svg>
<div id="framesLayer" style="display:none"></div>
<div id="canvasHint" style="display:none"></div>
<div id="inspectorEmpty" style="display:none"></div>
<div id="inspectorContent" style="display:none"></div>
<div id="inspectorMulti" style="display:none"></div>
<div id="inspectorArrow" style="display:none"></div>
<input id="inspTitle" style="display:none">
<textarea id="inspDesc" style="display:none"></textarea>
<textarea id="inspNotes" style="display:none"></textarea>
<div id="questionsList" style="display:none"></div>
<textarea id="promptOutput" style="display:none"></textarea>
<div id="promptSummary" style="display:none"></div>
<div id="selectBox" style="display:none"></div>
<div id="searchOverlay" style="display:none"></div>
<input id="searchInput" style="display:none">
<div id="searchResults" style="display:none"></div>
<div id="zoomIndicator" style="display:none"></div>
<div id="canvasTitle" style="display:none"></div>
<div id="shortcutOverlay" style="display:none"></div>
<div id="shortcutGrid" style="display:none"></div>
<input id="frameLabelInput" style="display:none">
<div id="templatesList" style="display:none"></div>
<div id="arrowInfo" style="display:none"></div>
<input id="arrowLabelInput" style="display:none">
<div id="healthBar" style="display:none"></div>
<div id="promptDiff" style="display:none"></div>

<div id="report">
  <div class="loading">Running tests...</div>
</div>

<script type="module">
  import { runAll, renderReport } from './test-utils.js'

  // The suite runs on the same origin as the app, and several tests exercise
  // real save/load round-trips. Snapshot every pathfinder-* localStorage key
  // before any test module loads, and restore them afterwards, so running
  // the tests never overwrites the canvas someone was actually working on.
  const preserved = new Map()
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i)
    if (k && k.startsWith('pathfinder-')) preserved.set(k, localStorage.getItem(k))
  }
  const restoreStorage = () => {
    const stray = []
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i)
      if (k && k.startsWith('pathfinder-') && !preserved.has(k)) stray.push(k)
    }
    stray.forEach(k => localStorage.removeItem(k))
    preserved.forEach((v, k) => localStorage.setItem(k, v))
  }
  window.addEventListener('pagehide', restoreStorage)

  // Import all test modules (this registers their describe/it calls)
  await import('./utils.test.js')
  await import('./state.test.js')
  await import('./search.test.js')
  await import('./gaps.test.js')
  await import('./prompt.test.js')
  await import('./canvas.test.js')
  await import('./normalize.test.js')
  await import('./events.test.js')
  await import('./image-export.test.js')
  await import('./route.test.js')
  await import('./layout.test.js')
  await import('./align.test.js')
  await import('./situation.test.js')
  await import('./highlight.test.js')
  await import('./zip.test.js')
  await import('./spec-export.test.js')
  await import('./task-plan.test.js')
  await import('./relations.test.js')
  await import('./attention.test.js')
  await import('./patch.test.js')
  await import('./interop.test.js')
  await import('./snapshots.test.js')
  await import('./comparison.test.js')
  await import('./library.test.js')
  await import('./library-search.test.js')
  await import('./save-status.test.js')
  await import('./sharing.test.js')
  await import('./user-templates.test.js')
  await import('./examples-page.test.js')
  await import('./review.test.js')
  await import('./trace.test.js')
  // Foundation (UI/UX overhaul wave 1)
  await import('./menu.test.js')
  await import('./create.test.js')
  await import('./foundation.test.js')
  await import('./inline-edit.test.js')
  await import('./types-foundation.test.js')
  // One file per wave-2 stream; each stream replaces its stub
  await import('./inspector-ui.test.js')
  await import('./context-menus.test.js')
  await import('./lines.test.js')
  await import('./chrome.test.js')
  await import('./navigation.test.js')
  await import('./types-registry.test.js')
  await import('./classifier.test.js')
  await import('./cards.test.js')
  await import('./insights.test.js')
  await import('./sharing-safety.test.js')
  await import('./data-safety.test.js')
  await import('./integration.test.js')
  // Open-items QA round (Firefox, WebKit, accessibility)
  await import('./qa2.test.js')
  // Design round, wave 1 (foundation): tokens, controls, header and footer
  await import('./design-tokens.test.js')
  // Design round, wave 2: one file per stream; each stream replaces its stub
  await import('./frontdoor.test.js')
  await import('./zoom.test.js')
  await import('./command.test.js')
  await import('./brief.test.js')
  await import('./roundtrip.test.js')
  await import('./braindump.test.js')
  await import('./consistency.test.js')

  // Run everything and render results
  const results = await runAll()
  // Restore twice: once after the app's debounced saves (300ms) have had
  // time to fire, since a pending save landing after a naive restore would
  // re-clobber the canvas with the last suite's fixture; and on pagehide,
  // for whoever navigates away faster than that.
  setTimeout(restoreStorage, 800)
  renderReport(document.getElementById('report'), results)

  // Also log summary to console
  const { totalPassed, totalFailed } = results
  const style = totalFailed ? 'color:#f87171' : 'color:#34d399'
  console.log(`%c${totalPassed}/${totalPassed + totalFailed} tests passed`, style + ';font-weight:bold')
  if (totalFailed) {
    results.suites.forEach(s => s.errors.forEach(e =>
      console.error(`FAIL [${s.name}] ${e.test}: ${e.error}`)
    ))
  }
</script>

</body>
</html>
