<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Pathfinder">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="neo-mark" content="on">
  <title>Not found | Pathfinder</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/styles/base.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* The site's tokens and buttons come from /css/style.css (root-absolute,
       so a 404 at any depth finds it). The page still reads if that file is
       what went missing: this fallback restates the few tokens it needs. */
    :root {
      --bg: oklch(0.165 0.012 285);
      --text-1: oklch(0.96 0.006 285);
      --text-2: oklch(0.80 0.010 285);
      --text-3: oklch(0.66 0.010 285);
    }
    body {
      margin: 0; height: auto; min-height: 100dvh; overflow: visible;
      display: grid; place-items: center;
      background: var(--bg); color: var(--text-1); text-align: center;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: 2rem;
    }
    .code { font-size: clamp(3rem, 12vw, 6rem); font-weight: 700; line-height: 1;
            margin: 0; color: var(--text-3); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: .75rem 0 .35rem; }
    p  { color: var(--text-2); margin: 0 0 1.5rem; max-width: 34ch; }
    .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>That page is not here</h1>
    <p>The link may be old, or the address may have a typo in it.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Pathfinder</a>
      <a class="btn btn-secondary" href="https://neorgon.com">All tools</a>
    </div>
  </main>
</body>
</html>
